name: Restore snapshot downloads

on:
  push:
    branches: [main]
    paths:
      - 'input/**'
      - 'tools/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snapshot-restore-${{ github.ref }}
  cancel-in-progress: true

jobs:
  restored:
    name: Restore and verify the official snapshot EXE
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install metadata readers
        run: python -m pip install dnfile==0.18.0 dncil==1.0.2
      - name: Verify committed input and fetch the donor
        run: python tools/prepare_inputs.py
      - name: Build the restoration tool in GitHub
        run: dotnet build tools/RestorePclKz/RestorePclKz.csproj --configuration Release --nologo
      - name: Restore the audited official snapshot
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          dotnet tools/RestorePclKz/bin/Release/net8.0/RestorePclKz.dll build-inputs/donor-2.14.exe build-inputs/original.exe artifacts/PCL-2.99-snapshot-restored.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item docs/RESTORATION-KZ.md artifacts/README.md
          Copy-Item build-inputs/inputs.json artifacts/inputs.json
      - name: Install static verification tools
        run: |
          dotnet tool install dotnet-ilverify --version 8.0.0 --tool-path "$env:RUNNER_TEMP/ilverify"
      - name: Compare IL verification against the original
        run: python tools/verification/verify_binaries.py --original build-inputs/original.exe --patched artifacts/PCL-2.99-snapshot-restored.exe --ilverify "$env:RUNNER_TEMP/ilverify/ILVerify.exe" --output verification
      # ILVerify accepts bodies the CLR rejects (it ignores MaxStackSize and the importer's
      # handler rules), so ask the runtime to compile every patched method as well.
      - name: JIT-compile every patched method
        shell: powershell
        run: ./tools/verification/jitcheck.ps1 -Executable artifacts/PCL-2.99-snapshot-restored.exe -PatchReport artifacts/PCL-2.99-snapshot-restored.exe.patch.json -OutputDirectory jitcheck
      - name: Windows startup smoke test
        run: ./tools/verification/smoke.ps1 -Executable artifacts/PCL-2.99-snapshot-restored.exe -OutputDirectory smoke-results
      - name: Record checksums
        run: |
          (Get-FileHash artifacts/PCL-2.99-snapshot-restored.exe -Algorithm SHA256).Hash.ToLower() + '  PCL-2.99-snapshot-restored.exe' | Set-Content artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: PCL-2.99-snapshot-restored
          path: artifacts/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: snapshot-restoration-verification
          path: |
            verification/
            jitcheck/
            smoke-results/
          retention-days: 30
          if-no-files-found: warn
